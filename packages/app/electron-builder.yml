appId: com.codenexus.desktop
productName: CodeNexus

publish:
  provider: github
  owner: QinQinChina
  repo: codeNexus
  releaseType: release
  channel: latest

directories:
  buildResources: build
  output: release

asar: true
beforePack: scripts/electron-builder-before-pack.mjs

files:
  - from: .
    to: .
    filter:
      - package.json
  - from: dist
    to: dist
    filter:
      - "**/*"

extraResources:
  - from: codex-runtime-manifest.json
    to: codex/codex-runtime-manifest.json
  - from: build/codex-runtime/${os}-${arch}
    to: codex/${os}-${arch}
    filter:
      - "**/*"
  - from: licenses/OpenAI-Codex-LICENSE.txt
    to: licenses/OpenAI-Codex-LICENSE.txt
  - from: licenses/OpenAI-Codex-NOTICE.txt
    to: licenses/OpenAI-Codex-NOTICE.txt
  - from: ../router/LICENSE
    to: licenses/CodexBridge-LICENSE.txt
  - from: music
    to: music
    filter:
      - "**/*"
  - from: build/icon.ico
    to: icon.ico

win:
  icon: build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
