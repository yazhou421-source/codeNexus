name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    if: github.repository == 'yazhou421-source/codeNexus' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Require stable tag to match package version
        run: node packages/app/scripts/verify-update-release.mjs --tag "$GITHUB_REF_NAME"
      - name: Refuse an existing release, including a draft
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: context.ref.replace('refs/tags/', '') });
              core.setFailed('Release already exists; refusing to overwrite it.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Full verification
        run: pnpm run ci
      - name: Fetch Codex runtime
        run: pnpm --filter @codenexus/app codex:runtime:fetch -- --platform mac-arm64
      - name: Verify Codex runtime
        run: pnpm --filter @codenexus/app codex:runtime:verify -- --platform mac-arm64
      - name: Package (never publish from electron-builder)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # GitHub creates empty env vars for missing secrets; builder requires absence.
          for credential in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!credential}" ]]; then unset "$credential"; fi
          done
          args=(--config electron-builder.yml --mac dmg zip --arm64 --publish never)
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          notarize=false
          if [[ -n "${CSC_LINK:-}" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            args+=(-c.forceCodeSigning=true)
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
              notarize=true
            fi
          fi
          args+=("-c.mac.notarize=$notarize")
          pnpm --filter @codenexus/app exec electron-builder "${args[@]}"
          if [[ -n "${CSC_LINK:-}" ]]; then
            codesign --verify --deep --strict "packages/app/release/mac-arm64/Calmnova Code.app"
          fi
          # A successful builder run with complete credentials has awaited notarization.
          if [[ "$notarize" == true ]]; then
            xcrun stapler validate "packages/app/release/mac-arm64/Calmnova Code.app"
          fi
      - name: Verify names, version, size and SHA-512
        run: node packages/app/scripts/verify-update-release.mjs --assets packages/app/release --tag "$GITHUB_REF_NAME"
      - name: Save verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Calmnova-${{ github.ref_name }}-macOS-arm64
          if-no-files-found: error
          path: |
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.blockmap
            packages/app/release/latest-mac.yml
      - name: Create draft only (creation fails if a release already exists)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              target_commitish: context.sha,
              name: `Calmnova Code ${context.ref.replace('refs/tags/v', '')}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            });
      - name: Upload without overwriting assets; leave draft for human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" packages/app/release/*.dmg packages/app/release/*.zip packages/app/release/*.blockmap packages/app/release/latest-mac.yml --repo "$GITHUB_REPOSITORY"
