name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Prepare bundled Codex runtime
        run: pnpm --filter @codenexus/app codex:runtime:fetch -- --platform win-x64

      - name: Verify bundled Codex runtime
        run: pnpm --filter @codenexus/app codex:runtime:verify -- --platform win-x64

      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @codenexus/app exec electron-builder --config electron-builder.yml --publish always

  macos-arm64:
    name: Build macOS arm64 artifacts
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Prepare bundled Codex runtime
        run: pnpm --filter @codenexus/app codex:runtime:fetch -- --platform mac-arm64

      - name: Verify bundled Codex runtime
        run: pnpm --filter @codenexus/app codex:runtime:verify -- --platform mac-arm64

      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @codenexus/app exec electron-builder --config electron-builder.yml --mac --arm64 --publish always
